<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#edf0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..700&family=Golos+Text:wght@400..700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rozpočet</title>
<style>
/* Tisícikoruna: fialový tiskařský inkoust na chladném papíře. */
:root{
  --paper:#edf0ea;--sheet:#f8f9f5;--ink:#1e2423;--ink-2:#5e6866;--rule:#d5dbd3;
  --violet:#4b3780;--violet-soft:#e4dff0;--on-violet:#ffffff;
  --ochre:#9a5b12;--green:#2f6f4f;--danger:#a3262a;
  --num:"Bodoni Moda",Georgia,serif;
  --text:"Golos Text",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#17151c;--sheet:#211e28;--ink:#ece9f1;--ink-2:#a39fad;--rule:#34303d;
  --violet:#b7a4e6;--violet-soft:#2d2640;--on-violet:#1a1426;
  --ochre:#e0a04a;--green:#7cc7a0;--danger:#f08a8a;
}
.hero .guil{opacity:.12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 16px/1.45 var(--text);min-height:100dvh;padding:0 0 calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
b{font-weight:600}

.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(16px + env(safe-area-inset-top)) 20px 8px}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
main{padding:0 20px 32px;max-width:560px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* sekce místo karet: nadpis + řádky oddělené linkou */
.sec{margin:28px 0 0}
.sec>h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 4px;font-size:17px;font-weight:600}
.sec>h2 small{font-size:14px;font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.lbl{color:var(--ink-2);font-size:13.5px}
.hint{color:var(--ink-2);font-size:14px;margin:8px 0 0;max-width:60ch}
.neg{color:var(--danger)!important}

/* ---------- hlavní číslo ---------- */
.hero{position:relative;overflow:hidden;margin:4px -20px 0;padding:18px 20px 22px;isolation:isolate}
.guil{position:absolute;z-index:-1;right:-110px;top:-70px;width:340px;height:340px;color:var(--violet);opacity:.22;pointer-events:none}
.hero .ask{margin:0;font-size:16px;color:var(--ink-2)}
.figure{display:flex;align-items:baseline;gap:10px;margin:2px 0 6px;color:var(--violet);font-family:var(--num);font-variant-numeric:lining-nums}
.figure .n{font-size:clamp(68px,22vw,96px);font-weight:600;line-height:1;letter-spacing:-.02em}
.figure .c{font-size:28px;font-weight:500}
.hero p.say{margin:0;font-size:15px;max-width:34ch}
.hero p.say b{font-variant-numeric:tabular-nums}

/* osa období od výplaty do výplaty */
.axis{margin:22px 0 0}
.track{position:relative;height:22px}
.track::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule);border-radius:1px}
.track .past{position:absolute;left:0;top:10px;height:2px;background:var(--violet);border-radius:1px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.track .tick{position:absolute;top:5px;width:2px;height:12px;margin-left:-1px;background:var(--ochre);border-radius:1px}
.track .tick.in{background:var(--green)}
.track .now{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 4px var(--paper)}
.axis .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px}
@media (prefers-reduced-motion:reduce){.track .past{transition:none}}

.balance{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.balance .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.balance .l{font-size:14px;color:var(--ink-2)}

/* ---------- řádky ---------- */
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.ico{width:40px;height:40px;border-radius:50%;background:var(--violet-soft);display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--ink-2);font-size:13.5px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--green)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pill{border:0;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;
  background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.paid{color:var(--green);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent)}
.pill.due{color:var(--ochre);background:color-mix(in srgb,var(--ochre) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ochre) 45%,transparent)}
.pill.wait{color:var(--ink)}
.pill.untracked{box-shadow:none}
.bar{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--violet);border-radius:2px}
.empty{color:var(--ink-2);padding:20px 0;font-size:15px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 0}
.monthnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:none;cursor:pointer;display:grid;place-items:center}
.monthnav b{display:block;font-size:20px;font-weight:600;text-transform:capitalize;text-align:center}
.monthnav .muted{display:block;text-align:center;font-size:14px}
.day{display:flex;justify-content:space-between;color:var(--ink-2);font-size:14px;margin:24px 0 0;padding-bottom:2px;font-variant-numeric:tabular-nums}
.day:first-letter{text-transform:uppercase}
.meter{display:flex;gap:4px;margin:12px 0 0}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.meter i.on{background:var(--violet)}

.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--violet);color:var(--on-violet);font-weight:600;font-size:16px;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:999px}

/* ---------- přidat + navigace ---------- */
#fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;
  background:var(--violet);color:var(--on-violet);display:grid;place-items:center;cursor:pointer;z-index:6;
  box-shadow:0 2px 4px rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 4px env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:4px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-2);cursor:pointer}
.tabs svg{width:56px;height:30px;padding:4px 16px;border-radius:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on svg{background:var(--violet-soft);color:var(--violet)}

/* ---------- dialogy ---------- */
dialog{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;max-height:92dvh;background:var(--sheet);color:var(--ink);
  border-radius:24px 24px 0 0;overflow:auto}
dialog::backdrop{background:rgba(20,16,30,.5)}
@media (min-width:600px){dialog{margin:auto;max-width:480px;border-radius:24px}}
.sheet{padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:28px;line-height:1;color:var(--ink-2);cursor:pointer;padding:2px 6px}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amtin{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--violet);margin-bottom:16px}
.amtin input{flex:1;min-width:0;border:0;background:none;font:600 46px/1.15 var(--num);padding:2px 0;outline:none;color:var(--violet)}
.amtin input::placeholder{color:var(--ink-2)}
.amtin span{font:500 24px var(--num);color:var(--ink-2)}
.quick{display:flex;gap:8px;overflow-x:auto;margin:-4px -20px 16px;padding:0 20px 2px;scrollbar-width:none}
.quick:empty{display:none}
.quick button{flex:none;border:0;box-shadow:inset 0 0 0 1px var(--rule);background:none;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.cats button{border:0;background:none;border-radius:14px;padding:8px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;color:var(--ink-2)}
.cats button span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--paper)}
.cats button.on{color:var(--ink);font-weight:600}
.cats button.on span{background:var(--violet-soft);box-shadow:inset 0 0 0 2px var(--violet)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:4px}
label.f input,label.f select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(166px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="top"><h1 id="title">Dnes</h1></header>
<main>
  <section class="view on" id="v-prehled"></section>
  <section class="view" id="v-historie"></section>
  <section class="view" id="v-pravidelne"></section>
  <section class="view" id="v-nastaveni"></section>
</main>

<button id="fab" aria-label="Přidat"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs">
  <button data-tab="prehled" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5v4.5l3 2"/></svg>Dnes</button>
  <button data-tab="historie"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9 8.5h6M9 12h6"/></svg>Historie</button>
  <button data-tab="pravidelne"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Pravidelné</button>
  <button data-tab="nastaveni"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Nastavení</button>
</nav>

<!-- Výdaj / příjem -->
<dialog id="d-tx"><form class="sheet" method="dialog" id="f-tx" novalidate>
  <h3><span id="tx-title">Nová útrata</span><button type="button" class="x" data-close>×</button></h3>
  <div class="seg" id="tx-type"><button type="button" data-v="out" class="on">Výdaj</button><button type="button" data-v="in">Příjem</button></div>
  <div class="amtin"><input id="tx-amt" inputmode="decimal" placeholder="0" autocomplete="off"><span>Kč</span></div>
  <div class="quick" id="tx-quick"></div>
  <div class="cats" id="tx-cats"></div>
  <div class="two">
    <label class="f"><span>Datum</span><input type="date" id="tx-date"></label>
    <label class="f"><span>Poznámka</span><input id="tx-note" placeholder="např. Albert" autocomplete="off" list="tx-notes"></label>
  </div>
  <button class="btn" type="submit">Uložit</button>
  <button class="btn danger" type="button" id="tx-del">Smazat</button>
</form></dialog>

<!-- Pravidelná platba -->
<dialog id="d-rec"><form class="sheet" method="dialog" id="f-rec" novalidate>
  <h3><span id="rec-title">Pravidelná platba</span><button type="button" class="x" data-close>×</button></h3>
  <div class="seg" id="rec-type"><button type="button" data-v="out" class="on">Platba</button><button type="button" data-v="in">Příjem (výplata…)</button></div>
  <label class="f"><span>Název</span><input id="rec-name" placeholder="např. Nájem, Netflix, Výplata" autocomplete="off"></label>
  <label class="f"><span>Částka (Kč)</span><input id="rec-amt" inputmode="decimal" placeholder="0" autocomplete="off"></label>
  <div class="two">
    <label class="f"><span>Opakování</span><select id="rec-freq"><option value="month">Každý měsíc</option><option value="year">Každý rok</option></select></label>
    <label class="f"><span>Den v měsíci</span><input id="rec-day" type="number" inputmode="numeric" min="1" max="31" value="1"></label>
  </div>
  <label class="f" id="rec-month-wrap" hidden><span>Měsíc</span><select id="rec-month"></select></label>
  <label class="f"><span>Kategorie</span><select id="rec-cat"></select></label>
  <div id="rec-now-wrap">
    <div class="lbl" id="rec-now-lbl" style="margin-bottom:4px">Tento měsíc</div>
    <div class="seg" id="rec-now" style="margin-bottom:0"><button type="button" data-v="no">Ještě ne</button><button type="button" data-v="yes" id="rec-now-yes">Už zaplaceno</button></div>
  </div>
  <p class="hint" id="rec-next"></p>
  <button class="btn" type="submit">Uložit</button>
  <button class="btn danger" type="button" id="rec-del">Smazat</button>
</form></dialog>

<!-- Zůstatek -->
<dialog id="d-bal"><form class="sheet" method="dialog" id="f-bal" novalidate>
  <h3><span id="bal-title">Zůstatek na účtu</span><button type="button" class="x" data-close>×</button></h3>
  <p class="hint" id="bal-hint" style="margin:0 0 14px">Zadej, kolik máš teď na účtu podle bankovnictví. Historie útrat zůstane, jen se srovná výsledný zůstatek.</p>
  <div class="amtin"><input id="bal-amt" inputmode="decimal" placeholder="0" autocomplete="off"><span>Kč</span></div>
  <div id="bal-diff-wrap" hidden>
    <p class="hint" id="bal-diff" style="margin:0 0 10px"></p>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:6px">
      <input type="checkbox" id="bal-log" checked style="width:20px;height:20px;accent-color:var(--violet)">
      Zapsat rozdíl do historie (doporučeno)</label>
  </div>
  <button class="btn" type="submit">Uložit</button>
</form></dialog>

<datalist id="tx-notes"></datalist>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'rozpocet.v1';

const CATS = {
  out: [
    {id:'jidlo',icon:'🛒',name:'Nákup'}, {id:'restaurace',icon:'🍽️',name:'Jídlo venku'},
    {id:'doprava',icon:'🚗',name:'Doprava'}, {id:'bydleni',icon:'🏠',name:'Bydlení'},
    {id:'uver',icon:'🏦',name:'Úvěr'}, {id:'energie',icon:'💡',name:'Energie'}, {id:'predplatne',icon:'📺',name:'Předplatné'},
    {id:'zabava',icon:'🎉',name:'Zábava'}, {id:'obleceni',icon:'👕',name:'Oblečení'},
    {id:'zdravi',icon:'💊',name:'Zdraví'}, {id:'darky',icon:'🎁',name:'Dárky'},
    {id:'sporeni',icon:'🐷',name:'Spoření'}, {id:'ostatni',icon:'📦',name:'Ostatní'},
    {id:'nezapsane',icon:'❓',name:'Nezapsané',hidden:true},
  ],
  in: [
    {id:'vyplata',icon:'💰',name:'Výplata'}, {id:'vraceno',icon:'↩️',name:'Vráceno'},
    {id:'dar',icon:'🎁',name:'Dar'}, {id:'prijem',icon:'➕',name:'Jiný příjem'},
    {id:'nezapsane',icon:'❓',name:'Nezapsané',hidden:true},
  ],
};
const MONTHS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];

/* ---------- pomocné funkce ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('cs-CZ', {style:'currency', currency:'CZK', minimumFractionDigits:0, maximumFractionDigits:2});
const money = n => fmt.format(Math.round(n * 100) / 100);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseAmt = s => { const v = parseFloat(String(s).replace(/[\s ]/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const catInfo = (type, id) => CATS[type].find(c => c.id === id) || {id, icon: type === 'in' ? '➕' : '📦', name: 'Ostatní'};
const shortDate = s => { const d = parse(s); return `${d.getDate()}. ${d.getMonth() + 1}.`; };
function dayLabel(s) {
  const t = today();
  if (s === t) return 'Dnes';
  if (s === addDays(t, -1)) return 'Včera';
  if (s === addDays(t, 1)) return 'Zítra';
  const d = parse(s);
  const o = {weekday:'long', day:'numeric', month:'numeric'};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('cs-CZ', o);
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- data ---------- */
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Nepodařilo se uložit data!'); } }
let S = load() || {v:1, setup:false, startBalance:0, tx:[], rec:[]};

// Pravidelná platba má období: měsíční 'YYYY-MM', roční 'YYYY'.
// Stav období: zapsaný záznam (tx.period) nebo ruční značka r.marks[key] = 'pre' (zaplaceno mimo aplikaci) | 'skip' (neproběhla).
function migrate() {
  // Den založení: výplata z toho dne a dřívější už je v zadaném zůstatku.
  if (S.setup && !S.setupDate) S.setupDate = [...S.rec.map(r => r.created), ...S.tx.map(t => t.date), today()].filter(Boolean).sort()[0];
  for (const r of S.rec) { r.marks ||= {}; r.created ||= r.last || today(); }
  for (const t of S.tx) if (t.recId && !t.period) {
    const r = S.rec.find(x => x.id === t.recId);
    t.period = r && r.freq === 'year' ? t.date.slice(0, 4) : t.date.slice(0, 7);
  }
}
migrate();

const balance = () => S.tx.reduce((s, t) => s + (t.type === 'in' ? t.amount : -t.amount), S.startBalance);
function setBalance(x) { S.startBalance += x - balance(); }

// Výskyty pravidelné platby v intervalu (from, to] – obě hodnoty jako 'YYYY-MM-DD'.
function occ(r, from, to) {
  const out = [], f = parse(from), t = parse(to);
  if (to <= from) return out;
  if (r.freq === 'year') {
    for (let y = f.getFullYear(); y <= t.getFullYear(); y++) {
      const m = r.month - 1, s = iso(new Date(y, m, Math.min(r.day, dim(y, m))));
      if (s > from && s <= to) out.push(s);
    }
  } else {
    let y = f.getFullYear(), m = f.getMonth();
    while (y < t.getFullYear() || (y === t.getFullYear() && m <= t.getMonth())) {
      const s = iso(new Date(y, m, Math.min(r.day, dim(y, m))));
      if (s > from && s <= to) out.push(s);
      if (++m > 11) { m = 0; y++; }
    }
  }
  return out;
}
const nextOcc = (r, from) => occ(r, from, addDays(from, 400))[0] || null;
const periodKey = (r, date) => r.freq === 'year' ? date.slice(0, 4) : date.slice(0, 7);
function dueDate(r, key) {
  const y = +key.slice(0, 4), m = r.freq === 'year' ? r.month - 1 : +key.slice(5, 7) - 1;
  return iso(new Date(y, m, Math.min(r.day, dim(y, m))));
}
const recTx = (r, key) => S.tx.find(t => t.recId === r.id && t.period === key);
// paid | pre | skip | wait (splatnost teprve bude) | due (po splatnosti, nezaplaceno) | untracked (před přidáním do aplikace)
function status(r, key) {
  const tx = recTx(r, key);
  if (tx) return {s:'paid', tx};
  if (r.marks[key]) return {s:r.marks[key]};
  if (key < periodKey(r, r.created)) return {s:'untracked'};
  const d = dueDate(r, key);
  return {s: d > today() ? 'wait' : 'due', d};
}
const isDone = s => s === 'paid' || s === 'pre' || s === 'skip';

// Zaúčtuje pravidelné platby, jejichž splatnost mezitím nastala (pokud už nejsou vyřízené).
function applyRecurring() {
  const t = today(); let n = 0;
  for (const r of S.rec) {
    for (const d of occ(r, r.last, t)) {
      const key = periodKey(r, d);
      if (recTx(r, key) || r.marks[key]) continue;
      S.tx.push({id:uid(), date:d, amount:r.amount, type:r.type, cat:r.cat, note:r.name, recId:r.id, period:key});
      n++;
    }
    r.last = t;
  }
  if (n) { save(); toast(n === 1 ? 'Zaúčtována 1 pravidelná platba' : `Zaúčtováno ${n} pravidelných plateb`); }
}

// Nevyřízené pravidelné pohyby: po splatnosti v aktuálním období + čekající do `to` (exkluzivně).
function pending(to) {
  const t = today(), list = [];
  for (const r of S.rec) {
    const k0 = periodKey(r, t), s0 = status(r, k0);
    if (s0.s === 'due') list.push({r, key:k0, d:s0.d});
    for (const d of occ(r, t, addDays(to, -1))) {
      const key = periodKey(r, d);
      if (status(r, key).s === 'wait') list.push({r, key, d});
    }
  }
  return list.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
}

function toggleStatus(id, key) {
  const r = S.rec.find(x => x.id === id); if (!r) return;
  const st = status(r, key), inc = r.type === 'in';
  if (st.s === 'paid') {
    if (!confirm(`${r.name}: označit jako ${inc ? 'nepřišlo' : 'neproběhlou'}? Záznam ${money(st.tx.amount)} se smaže z historie.`)) return;
    S.tx = S.tx.filter(t => t !== st.tx); r.marks[key] = 'skip';
    toast(`${r.name}: ${inc ? 'nepřišlo' : 'neproběhla'}`);
  } else if (st.s === 'pre') {
    if (!confirm(`${r.name}: zrušit označení „${inc ? 'přišlo' : 'zaplaceno'}“?`)) return;
    delete r.marks[key];
  } else {
    const t = today(), date = key < periodKey(r, t) ? dueDate(r, key) : t;
    S.tx.push({id:uid(), date, amount:r.amount, type:r.type, cat:r.cat, note:r.name, recId:r.id, period:key});
    delete r.marks[key];
    toast(`${r.name}: ${inc ? 'přišlo' : 'zaplaceno'} ${money(r.amount)}`);
  }
  save(); render();
}
function pill(r, key) {
  const st = status(r, key), inc = r.type === 'in';
  let cls = st.s, txt;
  if (st.s === 'paid') txt = `✓ ${inc ? 'Přišlo' : 'Zaplaceno'} ${shortDate(st.tx.date)}`;
  else if (st.s === 'pre') { cls = 'paid'; txt = `✓ ${inc ? 'Přišlo' : 'Zaplaceno'}`; }
  else if (st.s === 'skip') txt = inc ? '✕ Nepřišlo' : '✕ Neproběhla';
  else if (st.s === 'wait') txt = `Splatné ${shortDate(st.d)}`;
  else if (st.s === 'due') txt = inc ? '! Zatím nepřišlo' : '! Nezaplaceno';
  else txt = 'nesledováno';
  return `<button class="pill ${cls}" data-st="${r.id}|${key}">${txt}</button>`;
}
// Den výplaty: z měsíční pravidelné výplaty, jinak z Nastavení.
function salaryRec() {
  const monthly = S.rec.filter(r => r.type === 'in' && r.freq !== 'year');
  return monthly.find(r => r.cat === 'vyplata') || monthly[0] || null;
}
// Poslední zapsaná výplata (příjem s kategorií Výplata) – ruční nebo z pravidelné platby.
const lastSalary = () => S.tx.filter(x => x.type === 'in' && x.cat === 'vyplata' && x.date <= today())
  .reduce((m, x) => x.date > m ? x.date : m, '');
const payDay = () => salaryRec()?.day || S.payDay || (lastSalary() ? parse(lastSalary()).getDate() : null);
// Rozpočtové období: od poslední výplaty (start) do příští očekávané výplaty (date).
// Příští výplata = první den výplaty víc než 14 dní po té poslední, takže výplata o pár dní dřív/později nic nerozhodí.
// late: očekávaný den už byl, ale výplata ještě není zapsaná.
function horizon() {
  const t = today(), d = parse(t), day = payDay();
  if (!day) return {date:iso(new Date(d.getFullYear(), d.getMonth() + 1, 1)), start:t.slice(0, 8) + '01', payday:false};
  const P = {freq:'month', day}, last = lastSalary();
  const date = last ? nextOcc(P, addDays(last, 14)) : nextOcc(P, S.setupDate || t);
  let start = last;
  if (!start) {
    const at = (y, m) => iso(new Date(y, m, Math.min(day, dim(y, m))));
    start = at(d.getFullYear(), d.getMonth());
    if (start > t) { const p = new Date(d.getFullYear(), d.getMonth() - 1, 1); start = at(p.getFullYear(), p.getMonth()); }
  }
  return {date, start, payday:true, late:date <= t};
}

let tab = 'prehled';
let histMonth = today().slice(0, 7);

function txRow(t) {
  const c = catInfo(t.type, t.cat);
  const title = t.note || c.name;
  const meta = [t.note ? c.name : '', t.recId ? 'pravidelná' : ''].filter(Boolean).join(', ');
  return `<div class="row tap" data-tx="${t.id}"><div class="ico">${c.icon}</div>
    <div class="grow"><div class="name">${esc(title)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}</div>
    <div class="amt ${t.type}">${t.type === 'in' ? '+' : '−'}${money(t.amount)}</div></div>`;
}

function renderPrehled() {
  const t = today(), bal = balance(), H = horizon();
  // Platby splatné i v den výplaty se počítají ještě do tohoto období (výplata může přijít později než platba).
  // Když výplata mešká, počítá se opatrně se všemi platbami až do další řádné výplaty.
  const until = H.late ? nextOcc({freq:'month', day:payDay()}, t) : H.date;
  const ups = pending(addDays(until, 1));
  const outs = ups.filter(u => u.r.type === 'out').reduce((s, u) => s + u.r.amount, 0);
  const ins = ups.filter(u => u.r.type === 'in' && u.d < until).reduce((s, u) => s + u.r.amount, 0);
  const free = bal - outs + ins;
  const days = Math.max(1, daysBetween(t, H.date));
  const perDay = free / days;

  const month = S.tx.filter(x => x.date >= H.start && x.date <= t);
  const spent = month.filter(x => x.type === 'out').reduce((s, x) => s + x.amount, 0);
  const earned = month.filter(x => x.type === 'in').reduce((s, x) => s + x.amount, 0);
  const byCat = {};
  for (const x of month) if (x.type === 'out') byCat[x.cat] = (byCat[x.cat] || 0) + x.amount;
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;

  const next = pending(addDays(t, 32)).slice(0, 8);
  const daysTxt = days === 1 ? 'zbývá 1 den' : days < 5 ? `zbývají ${days} dny` : `zbývá ${days} dní`;
  const whole = n => new Intl.NumberFormat('cs-CZ', {maximumFractionDigits:0}).format(Math.floor(n));

  // Hlavní věta pod číslem – co číslo znamená a z čeho vzniklo.
  let ask, figure, say;
  if (H.late) {
    ask = `Výplata zatím nepřišla, čekala se ${shortDate(H.date)}`;
    figure = free;
    say = `Tolik ti zbývá, když odečteš platby do další výplaty${outs ? ` (${money(outs)})` : ''}. Až výplata přijde, zapiš ji tlačítkem + jako příjem.`;
  } else {
    ask = 'Dnes můžeš utratit';
    figure = perDay;
    const to = H.payday ? `do výplaty ${shortDate(H.date)}` : 'do konce měsíce';
    say = free < 0
      ? `Po zaplacení plateb ${to} ti bude chybět <b>${money(-free)}</b>.`
      : `Volných máš <b>${money(free)}</b> ${to}, ${daysTxt}.${outs ? ` Platby za ${money(outs)} jsou už odečtené.` : ''}`;
  }

  // Osa období: od začátku (výplata / 1.) do konce, dnešek a nevyřízené pravidelné.
  const span = Math.max(1, daysBetween(H.start, until));
  const pos = d => Math.min(100, Math.max(0, daysBetween(H.start, d) / span * 100));
  const ticks = ups.filter(u => u.d > t).map(u =>
    `<i class="tick ${u.r.type === 'in' ? 'in' : ''}" style="left:${pos(u.d)}%" title="${esc(u.r.name)} ${shortDate(u.d)}"></i>`).join('');

  $('#v-prehled').innerHTML = `
    <section class="hero">
      ${guilloche()}
      <p class="ask">${ask}</p>
      <div class="figure ${figure < 0 ? 'neg' : ''}"><span class="n">${figure < 0 ? '−' : ''}${whole(Math.abs(figure))}</span><span class="c">Kč</span></div>
      <p class="say">${say}</p>
      <div class="axis" aria-hidden="true">
        <div class="track"><i class="past" style="width:0" data-w="${pos(t)}%"></i>${ticks}<i class="now" style="left:${pos(t)}%"></i></div>
        <div class="ends"><span>${H.payday ? `výplata ${shortDate(H.start)}` : shortDate(H.start)}</span><span>${H.payday ? `výplata ${shortDate(until)}` : shortDate(addDays(until, -1))}</span></div>
      </div>
    </section>
    <div class="balance">
      <div><div class="l">Na účtu</div><div class="v">${money(bal)}</div></div>
      <button class="btn ghost small" data-act="bal">Srovnat s bankou</button>
    </div>
    ${H.payday ? '' : `<p class="hint">Nastav v Nastavení den, kdy ti chodí výplata. Aplikace pak počítá od výplaty do výplaty, ne od prvního v měsíci.</p>`}
    <section class="sec"><h2>Nevyřízené pravidelné</h2>
      ${next.length ? next.map(({d, r, key}) => recRow(r, key, dayLabel(d))).join('')
        : `<div class="empty">${S.rec.length ? 'Na příští měsíc je všechno vyřízené.' : 'Zatím žádné. Přidej je v záložce Pravidelné.'}</div>`}
    </section>
    <section class="sec"><h2>${H.payday ? `Od výplaty ${shortDate(H.start)}` : 'Tento měsíc'}</h2>
      <p class="hint" style="margin:0 0 4px">Utraceno <b>${money(spent)}</b>${earned ? `, příjmy ${money(earned)}` : ''}</p>
      ${cats.length ? cats.map(([id, v]) => { const c = catInfo('out', id); return `
        <div class="row"><div class="ico">${c.icon}</div><div class="grow">
          <div style="display:flex;justify-content:space-between;gap:8px"><span class="name">${esc(c.name)}</span><span class="amt">${money(v)}</span></div>
          <div class="bar"><i style="width:${Math.max(2, v / max * 100)}%"></i></div></div></div>`; }).join('')
        : '<div class="empty">Zatím žádné útraty. Přidáš je tlačítkem +.</div>'}
    </section>`;
  // Jediný pohyb na stránce: osa se po otevření dovyplní k dnešku.
  requestAnimationFrame(() => requestAnimationFrame(() => { const p = $('.track .past'); if (p) p.style.width = p.dataset.w; }));
}

// Gilošový ornament jako na bankovkách: dva prstence otočených elips.
function guilloche() {
  let g = '';
  for (let i = 0; i < 36; i++) g += `<ellipse cx="170" cy="170" rx="160" ry="62" transform="rotate(${i * 5} 170 170)"/>`;
  for (let i = 0; i < 24; i++) g += `<ellipse cx="170" cy="170" rx="96" ry="40" transform="rotate(${i * 7.5 + 3} 170 170)"/>`;
  return `<svg class="guil" viewBox="0 0 340 340" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".7">${g}</g></svg>`;
}

function renderHistorie() {
  const [y, m] = histMonth.split('-').map(Number);
  const list = S.tx.filter(x => x.date.slice(0, 7) === histMonth)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const spent = list.filter(x => x.type === 'out').reduce((s, x) => s + x.amount, 0);
  const groups = [];
  for (const x of list) { const g = groups[groups.length - 1]; if (g && g.d === x.date) g.items.push(x); else groups.push({d:x.date, items:[x]}); }
  $('#v-historie').innerHTML = `
    ${monthNav('m', `${MONTHS[m - 1]} ${y}`, `utraceno ${money(spent)}`)}
    ${groups.length ? groups.map(g => {
      const net = g.items.reduce((s, x) => s + (x.type === 'in' ? x.amount : -x.amount), 0);
      return `<div class="day"><span>${dayLabel(g.d)}</span><span>${net > 0 ? '+' : net < 0 ? '−' : ''}${money(Math.abs(net))}</span></div>
        <div>${g.items.map(txRow).join('')}</div>`;
    }).join('') : '<div class="empty">V tomto měsíci nic není. Útratu přidáš tlačítkem +.</div>'}`;
}
const chev = d => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
function monthNav(p, title, sub) {
  return `<div class="monthnav"><button data-act="${p}prev" aria-label="Předchozí měsíc">${chev('M15 6l-6 6 6 6')}</button>
    <div><b>${title}</b><span class="muted">${sub}</span></div>
    <button data-act="${p}next" aria-label="Další měsíc">${chev('M9 6l6 6-6 6')}</button></div>`;
}

function recDesc(r) {
  return r.freq === 'year' ? `každý rok ${r.day}. ${MONTHS[r.month - 1].slice(0, 3)}.` : `každý měsíc ${r.day}.`;
}
function recRow(r, key, meta) {
  const c = catInfo(r.type, r.cat);
  return `<div class="row tap" data-rec="${r.id}"><div class="ico">${c.icon}</div>
    <div class="grow"><div class="name">${esc(r.name)}</div><div class="meta">${esc(meta)}</div></div>
    <div class="right"><div class="amt ${r.type}">${r.type === 'in' ? '+' : '−'}${money(r.amount)}</div>${pill(r, key)}</div></div>`;
}
let recMonth = today().slice(0, 7);
function renderPravidelne() {
  const [y, m] = recMonth.split('-').map(Number);
  const keyFor = r => r.freq === 'year' ? recMonth.slice(0, 4) : recMonth;
  const inMonth = r => r.freq !== 'year' || r.month === m;
  const items = S.rec.filter(inMonth).sort((a, b) => a.day - b.day);
  const yearly = S.rec.filter(r => !inMonth(r)).sort((a, b) => a.month - b.month || a.day - b.day);
  const tracked = items.filter(r => status(r, keyFor(r)).s !== 'untracked');
  const done = tracked.filter(r => isDone(status(r, keyFor(r)).s)).length;
  const left = tracked.filter(r => r.type === 'out' && !isDone(status(r, keyFor(r)).s)).reduce((s, r) => s + r.amount, 0);
  const perMonth = S.rec.filter(r => r.type === 'out').reduce((s, r) => s + (r.freq === 'year' ? r.amount / 12 : r.amount), 0);
  const section = (title, list, key, meta) => list.length
    ? `<section class="sec"><h2>${title}</h2>${list.map(r => recRow(r, key(r), meta(r))).join('')}</section>` : '';
  $('#v-pravidelne').innerHTML = `
    ${monthNav('r', `${MONTHS[m - 1]} ${y}`, `${money(Math.round(perMonth))} měsíčně`)}

    <p class="hint" style="margin-top:8px">Vyřízeno <b>${done} z ${tracked.length}</b>${left ? `, zbývá zaplatit <b>${money(left)}</b>` : ', všechno zaplaceno'}.</p>
    ${section('Příjmy', items.filter(r => r.type === 'in'), keyFor, recDesc)}
    ${section('Platby', items.filter(r => r.type === 'out'), keyFor, recDesc)}
    ${section(`Roční platby, stav za rok ${y}`, yearly, keyFor, recDesc)}
    <p class="hint">V den splatnosti se platba sama zapíše jako zaplacená. Klepnutím na stav ho změníš, třeba když platba neproběhla nebo jsi zaplatil dřív.</p>`
    : '<div class="empty">Zatím žádné pravidelné platby. Přidej nájem, předplatné nebo splátku tlačítkem +.</div>'}`;
}

let txEdit = null, txType = 'out', txCat = 'jidlo', catTouched = false;
function drawCats() {
  $('#tx-cats').innerHTML = CATS[txType].filter(c => !c.hidden || c.id === txCat).map(c =>
    `<button type="button" data-cat="${c.id}" class="${c.id === txCat ? 'on' : ''}"><span>${c.icon}</span>${esc(c.name)}</button>`).join('');

// Známé poznámky (obchody) z ručně zapsaných záznamů: kolikrát, naposledy, s jakou kategorií.
function knownNotes(type) {
  const map = new Map();
  for (const x of [...S.tx].sort((a, b) => a.date < b.date ? -1 : 1)) {
    if (x.recId || !x.note || x.type !== type || catInfo(type, x.cat).hidden) continue;
    const k = x.note.toLowerCase(), o = map.get(k) || {count:0};
    map.set(k, {note:o.note || x.note, cat:x.cat, count:o.count + 1, last:x.date});
  }
  return [...map.values()].sort((a, b) => b.count - a.count || (a.last < b.last ? 1 : -1));
}
function drawQuick() {
  const list = knownNotes(txType);
  $('#tx-notes').innerHTML = list.slice(0, 50).map(n => `<option value="${esc(n.note)}">`).join('');
  $('#tx-quick').innerHTML = txEdit ? '' : list.slice(0, 8).map(n =>
    `<button type="button" data-note="${esc(n.note)}" data-cat="${n.cat}">${catInfo(txType, n.cat).icon} ${esc(n.note)}</button>`).join('');
}
function setTxType(t) {
  txType = t;
  document.querySelectorAll('#tx-type button').forEach(b => b.classList.toggle('on', b.dataset.v === t));
  if (!CATS[t].some(c => c.id === txCat)) txCat = CATS[t][0].id;
  drawCats(); drawQuick();
}
function openTx(tx) {
  txEdit = tx || null; catTouched = !!tx;
  $('#tx-title').textContent = tx ? 'Upravit záznam' : 'Nová útrata';
  txCat = tx ? tx.cat : 'jidlo';
  setTxType(tx ? tx.type : 'out');
  $('#tx-amt').value = tx ? String(tx.amount).replace('.', ',') : '';
  $('#tx-date').value = tx ? tx.date : today();
  $('#tx-note').value = tx ? tx.note || '' : '';
  $('#tx-del').hidden = !tx;
  $('#d-tx').showModal();
  if (!tx) setTimeout(() => $('#tx-amt').focus(), 50);
}
$('#tx-type').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTxType(b.dataset.v); });
$('#tx-cats').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { txCat = b.dataset.cat; catTouched = true; drawCats(); } });
$('#tx-quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $('#tx-note').value = b.dataset.note; txCat = b.dataset.cat; catTouched = true; drawCats();
  $('#tx-amt').focus();
});
// Napíšeš známý obchod → sama se vybere kategorie, kterou jsi u něj použil naposledy.
$('#tx-note').addEventListener('input', () => {
  if (catTouched) return;
  const n = knownNotes(txType).find(n => n.note.toLowerCase() === $('#tx-note').value.trim().toLowerCase());
  if (n) { txCat = n.cat; drawCats(); }
});
$('#f-tx').addEventListener('submit', e => {
  e.preventDefault();
  const amount = parseAmt($('#tx-amt').value);
  if (!(amount > 0)) { toast('Zadej částku'); $('#tx-amt').focus(); return; }
  const data = {amount, type:txType, cat:txCat, date:$('#tx-date').value || today(), note:$('#tx-note').value.trim()};
  if (txEdit) Object.assign(txEdit, data); else S.tx.push({id:uid(), ...data});
  save(); $('#d-tx').close(); render();
  toast(txEdit ? 'Uloženo' : `Přidáno: ${txType === 'in' ? '+' : '−'}${money(amount)}`);
});
$('#tx-del').addEventListener('click', () => {
  if (!txEdit || !confirm('Opravdu smazat tento záznam?')) return;
  S.tx = S.tx.filter(x => x !== txEdit); save(); $('#d-tx').close(); render(); toast('Smazáno');
});

/* ---------- dialog: pravidelná platba ---------- */
let recEdit = null, recType = 'out';
$('#rec-month').innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
function fillRecCats(sel) {
  $('#rec-cat').innerHTML = CATS[recType].filter(c => !c.hidden).map(c => `<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('');
  $('#rec-cat').value = CATS[recType].some(c => c.id === sel) ? sel : (recType === 'in' ? 'vyplata' : 'bydleni');
}
function setRecType(t, sel) {
  recType = t;
  document.querySelectorAll('#rec-type button').forEach(b => b.classList.toggle('on', b.dataset.v === t));
  fillRecCats(sel ?? $('#rec-cat').value);
}
function recFromForm() {
  return {name:$('#rec-name').value.trim(), amount:parseAmt($('#rec-amt').value), type:recType, freq:$('#rec-freq').value,
    day:Math.min(31, Math.max(1, parseInt($('#rec-day').value, 10) || 1)), month:parseInt($('#rec-month').value, 10), cat:$('#rec-cat').value};
}
let recNow = 'no', recNowTouched = false;
function updateRecHint() {
  $('#rec-month-wrap').hidden = $('#rec-freq').value !== 'year';
  const r = recFromForm(), t = today(), inc = r.type === 'in';
  $('#rec-now-wrap').hidden = !!recEdit;
  if (recEdit) {
    const n = nextOcc(r, t);
    $('#rec-next').textContent = n ? `Další splatnost: ${shortDate(n)}` : '';
    return;
  }
  const d = dueDate(r, periodKey(r, t));
  if (!recNowTouched) recNow = d <= t ? 'yes' : 'no';
  $('#rec-now-lbl').textContent = r.freq === 'year' ? `Letos (splatnost ${shortDate(d)})` : `Tento měsíc (splatnost ${shortDate(d)})`;
  $('#rec-now-yes').textContent = inc ? 'Už přišlo' : 'Už zaplaceno';
  document.querySelectorAll('#rec-now button').forEach(b => b.classList.toggle('on', b.dataset.v === recNow));
  const next = nextOcc(r, d > t ? d : t);
  $('#rec-next').textContent =
    recNow === 'yes' ? `Je už v zůstatku, nic se neodečte. Další splatnost: ${shortDate(next)}`
    : d <= t ? `Splatnost už byla. Povede se jako ${inc ? 'nepřišlá' : 'nezaplacená'}, dokud ji neoznačíš.`
    : `${inc ? 'Přičte' : 'Odečte'} se automaticky: ${shortDate(d)}`;
}
$('#rec-now').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { recNow = b.dataset.v; recNowTouched = true; updateRecHint(); } });
function openRec(r) {
  recEdit = r || null;
  recNowTouched = false;
  $('#rec-title').textContent = r ? 'Upravit pravidelnou' : 'Nová pravidelná';
  setRecType(r ? r.type : 'out', r ? r.cat : undefined);
  $('#rec-name').value = r ? r.name : '';
  $('#rec-amt').value = r ? String(r.amount).replace('.', ',') : '';
  $('#rec-freq').value = r ? r.freq : 'month';
  $('#rec-day').value = r ? r.day : new Date().getDate();
  $('#rec-month').value = r ? r.month || 1 : new Date().getMonth() + 1;
  $('#rec-del').hidden = !r;
  updateRecHint();
  $('#d-rec').showModal();
}
$('#rec-type').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setRecType(b.dataset.v); updateRecHint(); } });
['#rec-freq', '#rec-day', '#rec-month'].forEach(s => $(s).addEventListener('input', updateRecHint));
$('#f-rec').addEventListener('submit', e => {
  e.preventDefault();
  const d = recFromForm();
  if (!d.name) { toast('Zadej název'); $('#rec-name').focus(); return; }
  if (!(d.amount > 0)) { toast('Zadej částku'); $('#rec-amt').focus(); return; }
  if (recEdit) Object.assign(recEdit, d);
  else {
    const t = today(), marks = recNow === 'yes' ? {[periodKey(d, t)]:'pre'} : {};
    S.rec.push({id:uid(), created:t, last:t, marks, ...d});
  }
  save(); $('#d-rec').close(); render(); toast('Uloženo');
});
$('#rec-del').addEventListener('click', () => {
  if (!recEdit || !confirm(`Smazat „${recEdit.name}“? Už zapsané platby v historii zůstanou.`)) return;
  S.rec = S.rec.filter(r => r !== recEdit); save(); $('#d-rec').close(); render(); toast('Smazáno');
});

/* ---------- dialog: zůstatek ---------- */
function openBal(first) {
  $('#bal-title').textContent = first ? 'Vítej 👋' : 'Zůstatek na účtu';
  $('#bal-hint').textContent = first
    ? 'Na začátek zadej, kolik máš teď na účtu. Pak si přidej pravidelné platby a průběžně zapisuj útraty.'
    : 'Zadej, kolik máš teď na účtu podle bankovnictví.';
  $('#bal-amt').value = S.setup ? String(Math.round(balance() * 100) / 100).replace('.', ',') : '';
  $('#bal-log').checked = true;
  updateBalDiff();
  $('#d-bal').showModal();
  setTimeout(() => { $('#bal-amt').focus(); $('#bal-amt').select(); }, 50);
}
const balDiff = () => Math.round((parseAmt($('#bal-amt').value) - balance()) * 100) / 100;
function updateBalDiff() {
  const d = balDiff();
  $('#bal-diff-wrap').hidden = !S.setup || !d;
  if (!d) return;
  $('#bal-diff').innerHTML = d < 0
    ? `V bance máš o <b>${money(-d)}</b> méně, než ukazuje aplikace. Nejspíš nějaké útraty chybí – zapíšou se jako „❓ Nezapsané útraty“.`
    : `V bance máš o <b>${money(d)}</b> víc, než ukazuje aplikace. Rozdíl se zapíše jako „❓ Nezapsaný příjem“.`;
}
$('#bal-amt').addEventListener('input', updateBalDiff);
$('#f-bal').addEventListener('submit', e => {
  e.preventDefault();
  const v = parseAmt($('#bal-amt').value);
  if (isNaN(v)) { toast('Zadej částku'); return; }
  const d = balDiff();
  if (S.setup && d && $('#bal-log').checked) {
    S.tx.push({id:uid(), date:today(), amount:Math.abs(d), type:d < 0 ? 'out' : 'in', cat:'nezapsane',
      note:d < 0 ? 'Nezapsané útraty' : 'Nezapsaný příjem'});
  } else {
    if (!S.setup) S.setupDate = today();
    setBalance(v);
  }
  S.setup = true; save(); $('#d-bal').close(); render(); toast('Zůstatek srovnán s bankou');
});

/* ---------- akce ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
$('#fab').addEventListener('click', () => tab === 'pravidelne' ? openRec() : openTx());

document.querySelector('main').addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tx],[data-rec],[data-st]');
  if (!el) return;
  if (el.dataset.st) { const [id, key] = el.dataset.st.split('|'); return toggleStatus(id, key); }
  if (el.dataset.tx) return openTx(S.tx.find(x => x.id === el.dataset.tx));
  if (el.dataset.rec) return openRec(S.rec.find(r => r.id === el.dataset.rec));
  const a = el.dataset.act;
  if (a === 'bal') openBal(false);
  else if (a === 'mprev' || a === 'mnext') {
    const [y, m] = histMonth.split('-').map(Number), d = new Date(y, m - 1 + (a === 'mnext' ? 1 : -1), 1);
    histMonth = iso(d).slice(0, 7); render();
  }
  else if (a === 'rprev' || a === 'rnext') {
    const [y, m] = recMonth.split('-').map(Number), d = new Date(y, m - 1 + (a === 'rnext' ? 1 : -1), 1);
    recMonth = iso(d).slice(0, 7); render();
  }
  else if (a === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = `rozpocet-zaloha-${today()}.json`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  else if (a === 'import') $('#import-file').click();
  else if (a === 'wipe') {
    if (confirm('Opravdu smazat všechna data? Tohle nejde vrátit.') && confirm('Fakt? Doporučuju nejdřív stáhnout zálohu.')) {
      S = {v:1, setup:false, startBalance:0, tx:[], rec:[]}; save(); setTab('prehled'); openBal(true);
    }
  }
});

document.querySelector('main').addEventListener('change', e => {
  if (e.target.id !== 'payday') return;
  const v = parseInt(e.target.value, 10);
  S.payDay = v >= 1 && v <= 31 ? v : null; save();
  toast(S.payDay ? `Den výplaty: ${S.payDay}.` : 'Den výplaty zrušen');
});

$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.tx) || !Array.isArray(data.rec) || typeof data.startBalance !== 'number') throw 0;
    if (!confirm(`Obnovit zálohu (${data.tx.length} záznamů)? Současná data se nahradí.`)) return;
    S = data; S.setup = true; migrate(); applyRecurring(); save(); render(); toast('Záloha obnovena');
  } catch { toast('Tohle není platná záloha'); }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) { applyRecurring(); render(); } });

/* ---------- start ---------- */
applyRecurring();
setTab('prehled');
if (!S.setup) openBal(true);
else if (new URLSearchParams(location.search).has('pridat')) openTx(); // zkratka „Přidat útratu“ z ikony
if (location.search) history.replaceState(null, '', location.pathname);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
